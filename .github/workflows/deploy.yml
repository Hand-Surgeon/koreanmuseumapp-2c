name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run pre-deploy
        env:
          NEXT_PUBLIC_APP_URL: https://museum100.kr

  deploy:
    name: Build and deploy to Vercel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build deployment
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  smoke-test:
    name: Production smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify public routes
        run: |
          curl --fail --location --silent --show-error https://museum100.kr/ko > /dev/null
          curl --fail --location --silent --show-error https://museum100.kr/en > /dev/null
          curl --fail --location --silent --show-error https://museum100.kr/ko/artifact/1 > /dev/null
