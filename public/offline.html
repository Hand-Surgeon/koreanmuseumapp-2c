<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오프라인 - 국립중앙박물관 명품 100선</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            line-height: 1.6;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .content {
            background: white;
            border-radius: 1rem;
            padding: 3rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            text-align: center;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            background-color: #fbbf24;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #111827;
        }

        p {
            font-size: 1.125rem;
            color: #6b7280;
            margin-bottom: 2rem;
        }

        .button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .button:hover {
            background-color: #2563eb;
        }

        .features {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e7eb;
        }

        .features h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: #374151;
        }

        .features ul {
            list-style: none;
            text-align: left;
        }

        .features li {
            padding: 0.5rem 0;
            color: #6b7280;
            display: flex;
            align-items: center;
        }

        .features li:before {
            content: "✓";
            color: #10b981;
            font-weight: bold;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
                </svg>
            </div>

            <h1>오프라인 상태입니다</h1>
            <p>인터넷 연결이 필요합니다. 연결 상태를 확인하고 다시 시도해 주세요.</p>

            <a href="#" class="button" onclick="window.location.reload()">다시 시도</a>

            <div class="features">
                <h2>오프라인에서도 가능한 기능</h2>
                <ul>
                    <li>이미 방문한 페이지 보기</li>
                    <li>캐시된 유물 이미지 확인</li>
                    <li>즐겨찾기한 유물 목록</li>
                    <li>기본 앱 네비게이션</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // 온라인 상태가 되면 자동으로 새로고침
        window.addEventListener('online', () => {
            window.location.reload();
        });

        // Service Worker 등록 상태 확인
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then((registration) => {
                console.log('Service Worker 활성화됨:', registration.scope);
            });
        }
    </script>
</body>
</html>
